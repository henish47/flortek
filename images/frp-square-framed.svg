<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="framedBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <pattern id="gridSquare" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#475569"/>
      <rect x="6" y="0" width="6" height="6" fill="#334155"/>
      <rect x="0" y="6" width="6" height="6" fill="#334155"/>
      <rect x="6" y="6" width="6" height="6" fill="#475569"/>
    </pattern>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#framedBg)"/>
  
  <rect x="50" y="50" width="400" height="400" rx="12" fill="#475569" stroke="#1e293b" stroke-width="4" filter="url(#boxShadow)"/>
  <rect x="75" y="75" width="350" height="350" rx="8" fill="#334155" stroke="#0f172a" stroke-width="3"/>
  <rect x="95" y="95" width="310" height="310" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  
  <rect x="110" y="110" width="280" height="280" rx="4" fill="#475569"/>
  <rect x="115" y="115" width="270" height="270" rx="4" fill="url(#gridSquare)" opacity="0.8"/>
  
  <rect x="115" y="240" width="270" height="20" fill="#334155" opacity="0.9"/>
  <rect x="240" y="115" width="20" height="270" fill="#334155" opacity="0.9"/>

  <rect x="235" y="235" width="30" height="30" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="250" cy="250" r="6" fill="#f8fafc"/>

  <circle cx="62" cy="62" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="438" cy="62" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="62" cy="438" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="438" cy="438" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="250" y="180" font-family="'Montserrat', sans-serif" font-weight="900" font-size="15" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">FLORTEK</text>
  <text x="250" y="325" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">HEAVY DUTY 40T</text>
</svg>
