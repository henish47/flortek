    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
