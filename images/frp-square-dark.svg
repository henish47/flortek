<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="darkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    <pattern id="checkPatternDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#475569"/>
      <rect x="8" y="0" width="8" height="8" fill="#334155"/>
      <rect x="0" y="8" width="8" height="8" fill="#334155"/>
      <rect x="8" y="8" width="8" height="8" fill="#475569"/>
    </pattern>
    <linearGradient id="bevelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#darkBg)"/>
  
  <rect x="60" y="60" width="380" height="380" rx="18" fill="#334155" stroke="#1e293b" stroke-width="4" filter="url(#darkShadow)"/>
  <rect x="80" y="80" width="340" height="340" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  
  <rect x="95" y="95" width="310" height="310" rx="8" fill="url(#bevelDark)" stroke="#0f172a" stroke-width="2"/>
  <rect x="105" y="105" width="290" height="290" rx="6" fill="url(#checkPatternDark)" opacity="0.85"/>
  
  <line x1="95" y1="200" x2="405" y2="200" stroke="#1e293b" stroke-width="3"/>
  <line x1="95" y1="300" x2="405" y2="300" stroke="#1e293b" stroke-width="3"/>
  <line x1="200" y1="95" x2="200" y2="405" stroke="#1e293b" stroke-width="3"/>
  <line x1="300" y1="95" x2="300" y2="405" stroke="#1e293b" stroke-width="3"/>

  <rect x="235" y="235" width="30" height="30" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="250" cy="250" r="7" fill="#cbd5e1"/>
  
  <circle cx="140" cy="140" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="360" cy="140" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="140" cy="360" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="360" cy="360" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>

  <text x="250" y="170" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="3">FLORTEK</text>
  <text x="250" y="340" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">D-400 HEAVY DUTY</text>
</svg>
