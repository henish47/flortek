<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fac1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#fac1Grad)"/>
  <!-- Ceiling Lights -->
  <line x1="50" y1="40" x2="550" y2="40" stroke="#f8fafc" stroke-width="4" opacity="0.8"/>
  <line x1="100" y1="80" x2="500" y2="80" stroke="#f8fafc" stroke-width="3" opacity="0.6"/>
  <!-- Factory Floor -->
  <polygon points="0,220 600,220 600,400 0,400" fill="url(#floorGrad)"/>
  <polygon points="250,220 350,220 450,400 150,400" fill="#cbd5e1" opacity="0.5"/>
  <!-- Heavy Hydraulic Press Line Left -->
  <rect x="60" y="120" width="100" height="180" fill="#0f172a" stroke="#2E8B57" stroke-width="3" rx="6"/>
  <rect x="80" y="140" width="60" height="80" fill="#2E8B57" opacity="0.8"/>
  <rect x="70" y="240" width="80" height="50" fill="#F4B400" rx="4"/>
  <!-- Heavy Press Line Center -->
  <rect x="220" y="100" width="160" height="200" fill="#0f172a" stroke="#2E8B57" stroke-width="4" rx="8"/>
  <rect x="250" y="130" width="100" height="90" fill="#2E8B57"/>
  <text x="300" y="180" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">500T HYDRAULIC</text>
  <rect x="240" y="235" width="120" height="55" fill="#334155" rx="4"/>
  <!-- Heavy Press Line Right -->
  <rect x="440" y="120" width="100" height="180" fill="#0f172a" stroke="#2E8B57" stroke-width="3" rx="6"/>
  <rect x="460" y="140" width="60" height="80" fill="#2E8B57" opacity="0.8"/>
  <rect x="450" y="240" width="80" height="50" fill="#F4B400" rx="4"/>
  <!-- Foreground Stacked Products -->
  <rect x="30" y="320" width="90" height="40" fill="#334155" stroke="#0f172a" stroke-width="2" rx="4"/>
  <rect x="480" y="320" width="90" height="40" fill="#334155" stroke="#0f172a" stroke-width="2" rx="4"/>
  <!-- Badge -->
  <rect x="20" y="20" width="190" height="28" rx="6" fill="#2E8B57"/>
  <text x="115" y="38" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">HYDRAULIC PRESS PLANT</text>
</svg>
