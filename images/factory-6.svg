<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fac6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#fac6Grad)"/>
  <!-- Sea horizon -->
  <rect x="0" y="160" width="600" height="240" fill="#0369a1" opacity="0.6"/>
  <!-- Offshore platform structures -->
  <polygon points="400,60 480,60 460,280 420,280" fill="#334155" opacity="0.8"/>
  <rect x="360" y="80" width="160" height="40" fill="#1e293b"/>
  <!-- Yellow Handrails & Walkway Grating -->
  <rect x="0" y="240" width="600" height="160" fill="#F4B400" stroke="#d9a000" stroke-width="4"/>
  <!-- Safety Handrails -->
  <line x1="0" y1="210" x2="600" y2="210" stroke="#F4B400" stroke-width="8"/>
  <line x1="0" y1="170" x2="600" y2="170" stroke="#F4B400" stroke-width="8"/>
  <line x1="80" y1="170" x2="80" y2="240" stroke="#F4B400" stroke-width="8"/>
  <line x1="200" y1="170" x2="200" y2="240" stroke="#F4B400" stroke-width="8"/>
  <line x1="320" y1="170" x2="320" y2="240" stroke="#F4B400" stroke-width="8"/>
  <line x1="440" y1="170" x2="440" y2="240" stroke="#F4B400" stroke-width="8"/>
  <line x1="560" y1="170" x2="560" y2="240" stroke="#F4B400" stroke-width="8"/>
  <rect x="20" y="20" width="220" height="28" rx="6" fill="#2E8B57"/>
  <text x="130" y="38" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">OFFSHORE FRP WALKWAYS</text>
</svg>
