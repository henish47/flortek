<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4B400"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="nightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#F4B400" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1000" height="450" fill="url(#nightSky)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="450" cy="70" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="700" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="880" cy="60" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Modern Corporate Campus Building -->
  <polygon points="200,120 800,120 820,380 180,380" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <!-- Glowing Architectural Windows -->
  <g fill="url(#glowYellow)" filter="url(#nightGlow)">
    <rect x="230" y="150" width="80" height="40" rx="4"/>
    <rect x="330" y="150" width="80" height="40" rx="4"/>
    <rect x="430" y="150" width="80" height="40" rx="4"/>
    <rect x="530" y="150" width="80" height="40" rx="4"/>
    <rect x="630" y="150" width="80" height="40" rx="4"/>

    <rect x="230" y="210" width="80" height="40" rx="4"/>
    <rect x="330" y="210" width="80" height="40" rx="4"/>
    <rect x="430" y="210" width="80" height="40" rx="4"/>
    <rect x="530" y="210" width="80" height="40" rx="4"/>
    <rect x="630" y="210" width="80" height="40" rx="4"/>

    <rect x="230" y="270" width="80" height="40" rx="4"/>
    <rect x="330" y="270" width="80" height="40" rx="4"/>
    <rect x="430" y="270" width="80" height="40" rx="4"/>
    <rect x="530" y="270" width="80" height="40" rx="4"/>
    <rect x="630" y="270" width="80" height="40" rx="4"/>
  </g>

  <!-- Glass Entrance Canopy -->
  <rect x="450" y="310" width="100" height="70" fill="#0284c7" opacity="0.6"/>
  
  <!-- Ground Reflection & Landscaping -->
  <rect x="0" y="380" width="1000" height="70" fill="#0f172a"/>
  
  <!-- Badge -->
  <rect x="30" y="30" width="300" height="32" rx="6" fill="#2E8B57"/>
  <text x="180" y="51" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">CORPORATE HEADQUARTERS &amp; R&amp;D</text>
</svg>
