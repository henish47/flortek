<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lightBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <pattern id="checkPatternLight" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f8fafc"/>
      <rect x="10" y="0" width="10" height="10" fill="#e2e8f0"/>
      <rect x="0" y="10" width="10" height="10" fill="#e2e8f0"/>
      <rect x="10" y="10" width="10" height="10" fill="#f8fafc"/>
    </pattern>
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#lightBg)"/>
  
  <rect x="60" y="60" width="380" height="380" rx="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4" filter="url(#softShadow)"/>
  <rect x="80" y="80" width="340" height="340" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  
  <rect x="95" y="95" width="310" height="310" rx="8" fill="url(#bevelLight)" stroke="#64748b" stroke-width="2"/>
  <rect x="105" y="105" width="290" height="290" rx="6" fill="url(#checkPatternLight)" opacity="0.6"/>
  
  <rect x="120" y="120" width="260" height="260" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 4"/>
  
  <circle cx="250" cy="250" r="28" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <path d="M 235 242 L 265 242 L 250 262 Z" fill="#475569"/>
  <circle cx="250" cy="250" r="6" fill="#334155"/>
  
  <text x="250" y="180" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="3">FLORTEK FRP</text>
  <text x="250" y="340" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">EN-124 C-250</text>
  
  <circle cx="115" cy="115" r="5" fill="#64748b"/>
  <circle cx="385" cy="115" r="5" fill="#64748b"/>
  <circle cx="115" cy="385" r="5" fill="#64748b"/>
  <circle cx="385" cy="385" r="5" fill="#64748b"/>
</svg>
