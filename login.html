<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | FLORTEK INDUSTRIES PVT. LTD.</title>
  <meta name="description" content="Sign in to access the FLORTEK Admin Panel. Manage industrial FRP, BMC products, specifications, and inquiries.">
  <link rel="icon" type="image/svg+xml" href="images/flortek-logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="container-fluid p-0 login-page-container">
    <div class="row g-0 min-vh-100 w-100">

      <aside class="col-lg-6 brand-side-section d-flex align-items-center justify-content-center" aria-label="Brand Overview">
        <div class="brand-showcase-box">
          <a href="index.html" class="brand-logo-link" title="Return to FLORTEK Homepage">
            <img src="images/flortek-login-logo.png" alt="FLORTEK Logo" class="brand-logo-image">
          </a>
          <h1 class="brand-company-name">FLORTEK INDUSTRIES PVT. LTD.</h1>
          <p class="brand-tagline">Industrial Excellence &amp; Innovation</p>
          <div class="brand-accent-divider" aria-hidden="true"></div>
        </div>
      </aside>

      <main class="col-lg-6 form-side-section d-flex align-items-center justify-content-center" aria-label="Admin Sign In">
        <div class="login-card">
          
          <h2 class="card-title">Welcome Back</h2>
          <p class="card-subtitle">Sign in to access the FLORTEK Admin Panel.</p>

          <form class="login-form" action="#" method="POST">

            <div class="form-group mb-3">
              <label class="form-label" for="user-email">Email Address</label>
              <div class="input-container">
                <span class="input-icon left" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input 
                  type="email" 
                  id="user-email" 
                  name="email" 
                  class="text-input" 
                  placeholder="Enter your email" 
                  required 
                  autocomplete="email"
                >
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="user-password">Password</label>
              <div class="input-container">
                <span class="input-icon left" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="user-password" 
                  name="password" 
                  class="text-input" 
                  placeholder="Enter your password" 
                  required 
                  autocomplete="current-password"
                >
                <span class="input-icon right" aria-label="Toggle password view" role="button" tabindex="0">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
              </div>
            </div>

            <div class="form-options-row d-flex align-items-center justify-content-between mb-4">
              <label class="remember-me-label" for="remember-me">
                <input type="checkbox" id="remember-me" name="remember" class="remember-checkbox">
                <span>Remember Me</span>
              </label>
              <a href="#" class="forgot-password-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit-signin w-100">Sign In</button>

          </form>

          <footer class="card-bottom-footer mt-4 text-center">
            <p class="footer-company-text">FLORTEK INDUSTRIES PVT. LTD.</p>
          </footer>

        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
